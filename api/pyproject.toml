[project]
name = "dataaps-demo-api"
version = "1.0.0"
description = "API de demonstração do DataAPS com dados sintéticos"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
